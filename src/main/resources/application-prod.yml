spring:
  mongodb:
    host: ${kyc.config.database.mongodb.host}
    port: ${kyc.config.database.mongodb.port}
    username: ${kyc.config.database.mongodb.username}
    password: ${kyc.config.database.mongodb.secret}
    database: kyc_database
  ssl:
    bundle:
      jks:
        kyc-bundle:
          key:
            alias: ${kyc.config.keystore.card-payment-processor.alias}
            password: ${kyc.config.keystore.card-payment-processor.secret}
          truststore:
            location: ${kyc.config.keystore.card-payment-processor.path}
            password: ${kyc.config.keystore.card-payment-processor.secret}
            type: PKCS12
          keystore:
            location: ${kyc.config.keystore.card-payment-processor.path}
            password: ${kyc.config.keystore.card-payment-processor.secret}
            type: PKCS12

kyc-config:
  tcp:
    port: 9200
    timeout: 15000
    backlog: 50
    client-auth: true
    ip-filter:
      enabled: true
      allowed-ip: ${kyc.config.whitelist.card-payment-processor}

logging:
  file:
    name: /opt/kyc/logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      file-name-pattern: /opt/kyc/logs/${spring.application.name}/%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 50MB
      max-history: 3
  level:
    root: INFO
    com.kyc: INFO
    org.springframework: INFO
    org.springframework.integration: INFO
    org.springframework.integration.channel: INFO
    org.springframework.integration.handler: INFO
    org.springframework.integration.messaging: INFO
    org.springframework.data.mongodb.core: INFO