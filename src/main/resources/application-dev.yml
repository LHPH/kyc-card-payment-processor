spring:
  mongodb:
    username: kyc_user
    host: localhost
    port: 27017
    password: kyc_pass
    database: kyc_database

kyc-config:
  tcp:
    port: 9990
    timeout: 15000
    backlog: 50
    ip-filter:
      enabled: true
      allowed-ip:
        - 127.0.0.1

logging:
  level:
    root: INFO
    com.kyc: INFO
    org.springframework: INFO