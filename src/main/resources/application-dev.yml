spring:
  ssl:
    bundle:
      jks:
        kyc-bundle:
          key:
            alias: server
            password: test123
          truststore:
            location: classpath:keystore.p12
            password: test123
            type: PKCS12
          keystore:
            location: classpath:keystore.p12
            password: test123
            type: PKCS12
  mongodb:
    username: kyc_user
    host: localhost
    port: 27017
    password: kyc_pass
    database: kyc_database

kyc-config:
  tcp:
    port: 9200
    timeout: 60000
    backlog: 50
    client-auth: false
    ip-filter:
      enabled: false
      allowed-ip:
        - 127.0.0.1

logging:
  level:
    root: INFO
    com.kyc: INFO
    org.springframework: INFO
    org.springframework.integration: INFO
    org.springframework.integration.channel: DEBUG
    org.springframework.integration.handler: DEBUG
    org.springframework.integration.messaging: DEBUG
    org.springframework.data.mongodb.core: DEBUG